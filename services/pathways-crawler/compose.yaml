services:
  crawler:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "127.0.0.1:5488:5488"
    volumes:
      - crawler-state:/data
      - ${AXOM_SCHOOLS_FILE:?Set AXOM_SCHOOLS_FILE to the existing school JSON}:/input/application-schools.json:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5488/api/status',timeout=5).read()"]
      interval: 60s
      timeout: 10s
      retries: 3
volumes:
  crawler-state:
