[package]
name = "axom"
version = "0.0.2-prebeta"
description = "AXOM desktop application"
authors = ["AXOM"]
license = "UNLICENSED"
repository = "https://github.com/jaclose/Noctyrium"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "axom_lib"
# Desktop executables only; do not also emit unused iOS/Android libraries.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.12"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"

# Native JavaScript dialogs (src/webview_dialogs.rs). Already in the tree via wry.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSString"] }

# Keep local builds small; updater assets never need compiler debug symbols.
[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = "debuginfo"
