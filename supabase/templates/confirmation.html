<h2>Confirm your AXOM account</h2>
<p>Enter this code in AXOM to confirm your email (it works in the browser and the desktop app):</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px;">{{ .Token }}</p>
<p>Or, in a browser, <a href="{{ .ConfirmationURL }}">confirm with this link</a>.</p>
<p style="color:#666;">If you didn’t create an AXOM account, you can ignore this email.</p>
