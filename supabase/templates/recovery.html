<h2>Reset your AXOM password</h2>
<p>Enter this code in AXOM to choose a new password (it works in the browser and the desktop app):</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px;">{{ .Token }}</p>
<p>Or, in a browser, <a href="{{ .ConfirmationURL }}">reset it with this link</a>.</p>
<p style="color:#666;">If you didn’t ask to reset your password, you can ignore this email. Your password has not changed.</p>
