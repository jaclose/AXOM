name: Temporary V3 Communications Integrity Regeneration
on:
  push:
    branches:
      - codex/productivity-v3-cadence-unification-20261107
    paths:
      - .github/workflows/productivity-v3-regenerate.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned dependencies
        run: npm --prefix web ci --ignore-scripts
      - name: Regenerate canonical Communications Edge worker and templates
        run: |
          node scripts/build-communications.mjs
          node scripts/render-communications-auth.mjs
      - name: Record generated source truth only on the V3 draft branch
        run: |
          git add supabase/functions/communications/service.js supabase/functions/communications/source-manifest.json supabase/templates/communications
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='AXOM V3 Build' -c user.email='61708502+jaclose@users.noreply.github.com' commit -m 'build(communications): align Edge artifact with cadence and reports source'
          git push origin HEAD:codex/productivity-v3-cadence-unification-20261107
