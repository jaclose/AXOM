name: AXOM Save Repair Communications Rebuild

on:
  pull_request:
    paths:
      - ".github/workflows/local-save-communications-rebuild.yml"

permissions:
  contents: write

jobs:
  rebuild-preview:
    if: >-
      github.event.pull_request.head.ref == 'codex/local-save-status-repair-20261106'
      && github.event.pull_request.head.repo.full_name == 'jaclose/AXOM'
      && github.event.pull_request.user.login == 'jaclose'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node scripts/toolchain.mjs
      - run: npm --prefix web ci
      - name: Regenerate canonical Communications service and auth templates
        run: |
          node scripts/build-communications.mjs
          node scripts/render-communications-auth.mjs
          node scripts/preview-communications.mjs
          node scripts/verify-communications-artifacts.mjs
      # Static generation gate only. Separate AXOM Quality browser jobs remain
      # mandatory; the optional 160-template visual gallery runs independently.
      - name: Verify generated diff is scoped and build is complete
        run: |
          git diff --check
          git diff --name-only
          if git diff --name-only | grep -vE '^(supabase/functions/communications/(service[.]js|source-manifest[.]json)|supabase/templates/communications/[^/]+[.]html|artifacts/communications/.*)$'; then
            echo "::error::Unexpected generated-file modification"; exit 1
          fi
          git add -u -- supabase/functions/communications/service.js supabase/functions/communications/source-manifest.json supabase/templates/communications artifacts/communications
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::Expected generated artifacts to change"; exit 1
          fi
          git diff --cached --stat
      - name: Commit generated outputs to isolated review branch only
        env:
          PREVIEW_BRANCH: codex/local-save-communications-preview2-20261106
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current="$(git ls-remote --heads origin "refs/heads/$PREVIEW_BRANCH" | awk '{print $1}')"
          if [ "$current" != "$SOURCE_HEAD" ]; then
            echo "::error::Preview branch changed; refusing non-reconciled write"; exit 1
          fi
          git -c user.name='AXOM CI' -c user.email='actions@users.noreply.github.com' commit -m 'build(communications): regenerate from verified AXOM save-repair source'
          git push origin "HEAD:refs/heads/$PREVIEW_BRANCH"
