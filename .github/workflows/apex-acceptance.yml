name: APEX Academic Acceptance

on:
  pull_request:
    paths:
      - 'web/src/lib/course-engine/**'
      - 'web/src/lib/academicLibrary/**'
      - 'web/src/lib/questions*'
      - 'web/src/lib/quiz*'
      - 'web/src/components/questions/**'
      - 'web/src/components/tracker/**'
      - 'web/src/pages/CourseTrackerPage*.tsx'
      - 'web/src/pages/QuestionWorkspacePage*.tsx'
      - 'web/e2e/*academic*'
      - 'web/e2e/*course*'
      - 'web/e2e/*question*'
      - 'web/e2e/*exam*'
      - 'web/e2e/*quiz*'
      - 'web/e2e/*tracker*'
      - 'scripts/operations/academic-*.mjs'
      - '.github/workflows/apex-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-acceptance-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-web-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Verify supported toolchain
        run: node scripts/toolchain.mjs
      - run: npm ci
      - run: npm --prefix web ci
      - name: Repository regression tests and hygiene
        run: npm run test:repo && npm run repo:check
      - name: Academic acceptance path coverage regressions
        run: node --test scripts/operations/academic-acceptance-paths.test.mjs
      - name: Academic source reconciliation and PDF triage regressions
        run: node --test scripts/operations/academic-reconcile.test.mjs scripts/operations/academic-pdf-triage.test.mjs scripts/operations/academic-pdf-bridge.test.mjs scripts/operations/academic-tracker-identity.test.mjs
      - name: Install isolated browser runtime
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Complete web integration gate (no live-account credentials)
        run: |
          result=0
          npm --prefix web run verify:all > "$RUNNER_TEMP/apex-acceptance.log" 2>&1 || result=$?
          tail -n 160 "$RUNNER_TEMP/apex-acceptance.log"
          exit "$result"
      - name: Preserve acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apex-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/apex-acceptance.log
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
