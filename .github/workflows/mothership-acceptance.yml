name: Mothership Release Acceptance

on:
  pull_request:
    paths:
      - 'web/e2e/dashboard-widget-layout.spec.ts'
      - 'web/src/lib/operator/hostClient.ts'
      - 'web/src/lib/operator/hostClient.access.test.tsx'
      - 'web/src/lib/localVault.ts'
      - 'web/src/lib/localVault.test.ts'
      - 'web/src/lib/localVault.packedFallback.test.ts'
      - 'web/src/lib/storageRecovery.test.ts'
      - 'web/src/lib/localBackup.test.ts'
      - 'web/src/lib/updateCheckpoint.test.ts'
      - 'web/src/lib/account/accountStore.test.ts'
      - 'web/src/lib/questionImportAtomic.test.ts'
      - 'web/src/components/shell/SettingsModal.test.tsx'
      - 'web/src/lib/question-content/persistenceHarness.testing.ts'
      - 'web/src/lib/question-content/persistenceHarness.testing.test.ts'
      - 'web/src/lib/sharing/questionSetImport.persistence.test.ts'
      - 'web/src/components/questions/MassImport.accept.test.tsx'
      - 'web/src/components/questions/ImportPanel.persistence.test.tsx'
      - '.github/workflows/mothership-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mothership-acceptance-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-web-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Record tested revision and supported toolchain
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          node scripts/toolchain.mjs
      - run: npm ci
      - run: npm --prefix web ci
      # This independent source-level lane must run even when the separate
      # AXOM Quality web job stops at a generated Communications manifest drift.
      # It does not waive the generated-bundle/release-integrity gate.
      - name: Focused Local Vault recovery, packed fallback and snapshot regressions
        run: |
          result=0
          npm --prefix web run test -- src/lib/localVault.test.ts src/lib/localVault.packedFallback.test.ts src/lib/storageRecovery.test.ts --reporter=verbose > "$RUNNER_TEMP/mothership-vault.log" 2>&1 || result=$?
          tail -n 140 "$RUNNER_TEMP/mothership-vault.log"
          exit "$result"
      - name: Preserve independent Local Vault regression evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mothership-vault-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mothership-vault.log
          if-no-files-found: warn
          retention-days: 7
      - name: Shared fake-IDB teardown and import fixture regressions
        run: |
          result=0
          npm --prefix web run test -- src/lib/question-content/persistenceHarness.testing.test.ts src/lib/question-content/toReviewedImport.persistence.test.ts src/lib/academicLibrary/unscheduledInstall.test.ts src/lib/bookshelf/guardedCourseLoad.test.ts src/lib/bookshelf/preparedCoursesOwnership.test.ts src/lib/cloudLibrary/load.test.ts src/lib/privateLibrary/install.test.ts src/lib/sharing/questionSetImport.persistence.test.ts --reporter=verbose > "$RUNNER_TEMP/mothership-import-fixtures.log" 2>&1 || result=$?
          tail -n 160 "$RUNNER_TEMP/mothership-import-fixtures.log"
          exit "$result"
      - name: Preserve shared fixture lifecycle test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mothership-import-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mothership-import-fixtures.log
          if-no-files-found: warn
          retention-days: 7
      - name: Update checkpoint synthetic IDB and recovery regressions
        run: |
          result=0
          npm --prefix web run test -- src/lib/updateCheckpoint.test.ts --reporter=verbose > "$RUNNER_TEMP/mothership-update-checkpoint.log" 2>&1 || result=$?
          tail -n 120 "$RUNNER_TEMP/mothership-update-checkpoint.log"
          exit "$result"
      - name: Preserve checkpoint recovery test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mothership-update-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mothership-update-checkpoint.log
          if-no-files-found: warn
          retention-days: 7
      - name: Account merge, restore and download durable fixture regressions
        run: |
          result=0
          npm --prefix web run test -- src/lib/account/accountStore.test.ts --reporter=verbose > "$RUNNER_TEMP/mothership-account-recovery.log" 2>&1 || result=$?
          tail -n 160 "$RUNNER_TEMP/mothership-account-recovery.log"
          exit "$result"
      - name: Preserve account recovery fixture evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mothership-account-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mothership-account-recovery.log
          if-no-files-found: warn
          retention-days: 7
      - name: Atomic reviewed import and rollback fixture regressions
        run: |
          result=0
          npm --prefix web run test -- src/lib/questionImportAtomic.test.ts --reporter=verbose > "$RUNNER_TEMP/mothership-atomic-import.log" 2>&1 || result=$?
          tail -n 160 "$RUNNER_TEMP/mothership-atomic-import.log"
          exit "$result"
      - name: Preserve atomic import fixture evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mothership-atomic-import-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mothership-atomic-import.log
          if-no-files-found: warn
          retention-days: 7
      - name: Settings durable save status and recovery fixture regressions
        run: |
          result=0
          npm --prefix web run test -- src/components/shell/SettingsModal.test.tsx --reporter=verbose > "$RUNNER_TEMP/mothership-settings.log" 2>&1 || result=$?
          tail -n 160 "$RUNNER_TEMP/mothership-settings.log"
          exit "$result"
      - name: Preserve Settings save status evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mothership-settings-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mothership-settings.log
          if-no-files-found: warn
          retention-days: 7
      - name: Repository regression tests and hygiene
        run: npm run test:repo && npm run repo:check
      - name: Install isolated browser runtime
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Focused Host account-switch and role-cache tests
        run: |
          result=0
          npm --prefix web test -- src/lib/operator/hostClient.access.test.tsx --reporter=verbose > "$RUNNER_TEMP/mothership-host.log" 2>&1 || result=$?
          tail -n 100 "$RUNNER_TEMP/mothership-host.log"
          exit "$result"
      - name: Preserve Host race-test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mothership-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mothership-host.log
          if-no-files-found: warn
          retention-days: 7
      - name: Focused widget contract and browser journey
        run: |
          result=0
          npm --prefix web run test:e2e -- e2e/dashboard-widget-layout.spec.ts --workers=1 > "$RUNNER_TEMP/mothership-widget.log" 2>&1 || result=$?
          tail -n 100 "$RUNNER_TEMP/mothership-widget.log"
          exit "$result"
      - name: Preserve focused browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mothership-widget-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mothership-widget.log
            web/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Complete web integration gate (no live-account credentials)
        run: |
          result=0
          npm --prefix web run verify:all > "$RUNNER_TEMP/mothership-acceptance.log" 2>&1 || result=$?
          tail -n 160 "$RUNNER_TEMP/mothership-acceptance.log"
          exit "$result"
      - name: Preserve full acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mothership-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mothership-acceptance.log
            web/test-results/
            web/playwright-report/
          if-no-files-found: warn
          retention-days: 7
