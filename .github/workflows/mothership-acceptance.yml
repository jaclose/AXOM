name: Mothership Release Acceptance

on:
  pull_request:
    paths:
      - 'web/e2e/dashboard-widget-layout.spec.ts'
      - 'web/src/lib/operator/hostClient.ts'
      - 'web/src/lib/operator/hostClient.access.test.tsx'
      - '.github/workflows/mothership-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mothership-acceptance-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full-web-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Record tested revision and supported toolchain
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          node scripts/toolchain.mjs
      - run: npm ci
      - run: npm --prefix web ci
      - name: Repository regression tests and hygiene
        run: npm run test:repo && npm run repo:check
      - name: Install isolated browser runtime
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Focused Host account-switch and role-cache tests
        run: |
          result=0
          npm --prefix web test -- src/lib/operator/hostClient.access.test.tsx --reporter=verbose > "$RUNNER_TEMP/mothership-host.log" 2>&1 || result=$?
          tail -n 100 "$RUNNER_TEMP/mothership-host.log"
          exit "$result"
      - name: Preserve Host race-test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mothership-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mothership-host.log
          if-no-files-found: warn
          retention-days: 7
      - name: Focused widget contract and browser journey
        run: |
          result=0
          npm --prefix web run test:e2e -- e2e/dashboard-widget-layout.spec.ts --workers=1 > "$RUNNER_TEMP/mothership-widget.log" 2>&1 || result=$?
          tail -n 100 "$RUNNER_TEMP/mothership-widget.log"
          exit "$result"
      - name: Preserve focused browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mothership-widget-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mothership-widget.log
            web/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Complete web integration gate (no live-account credentials)
        run: |
          result=0
          npm --prefix web run verify:all > "$RUNNER_TEMP/mothership-acceptance.log" 2>&1 || result=$?
          tail -n 160 "$RUNNER_TEMP/mothership-acceptance.log"
          exit "$result"
      - name: Preserve full acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mothership-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mothership-acceptance.log
            web/test-results/
            web/playwright-report/
          if-no-files-found: warn
          retention-days: 7
