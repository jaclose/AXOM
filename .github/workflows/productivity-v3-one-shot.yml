name: V3 One-shot Focused Validation and Source Build
on:
  push:
    branches:
      - codex/productivity-v3-cadence-unification-20261107
    paths:
      - .github/workflows/productivity-v3-one-shot.yml
permissions:
  contents: write
jobs:
  validate_and_regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --ignore-scripts
      - name: Typecheck
        run: npm --prefix web run typecheck
      - name: Lint
        run: npm --prefix web run lint
      - name: Focused goal regressions
        run: npm --prefix web run test -- src/lib/goalCadence.test.ts src/lib/habits.test.ts src/lib/dailySuccess.test.ts src/lib/trackerStats.test.ts src/components/reports/CadenceGoalReport.test.tsx src/pages/HabitTrackerPage.test.tsx src/pages/ProductivityPage.test.tsx
      - name: Rebuild canonical Communications Edge worker and manifest
        run: |
          node scripts/build-communications.mjs
          node scripts/render-communications-auth.mjs
      - name: Commit generated deployment assets on draft branch only
        run: |
          git add supabase/functions/communications/service.js supabase/functions/communications/source-manifest.json supabase/templates/communications
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='AXOM V3 Build' -c user.email='61708502+jaclose@users.noreply.github.com' commit -m 'build(communications): align generated worker with approved V3 selectors'
          git push origin HEAD:codex/productivity-v3-cadence-unification-20261107
