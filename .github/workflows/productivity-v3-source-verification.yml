name: Productivity V3 source verification
on:
  push:
    branches:
      - codex/productivity-v3-cross-feature-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm --prefix web ci
      - name: Focused recurrence, report and UI contracts
        run: npm --prefix web run test -- src/lib/dailySuccess.test.ts src/lib/habits.test.ts src/components/productivity/DailyRequirementsEditor.test.tsx src/pages/ProductivityPage.test.tsx
      - name: Typecheck and compile web
        run: npm --prefix web run build
      - name: Regenerate Communications bundle and integrity manifest
        run: |
          node scripts/build-communications.mjs
          node scripts/render-communications-auth.mjs
          node --test scripts/render-welcome-draft.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: axom-v3-communications-generated
          path: |
            supabase/functions/communications/service.js
            supabase/functions/communications/source-manifest.json
            supabase/templates/communications/*.html
          retention-days: 7

  quality:
    name: AXOM Quality exact-head verification
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
