name: Mothership Calendar Isolation

on:
  push:
    branches:
      - codex/mothership-ics114-diagnostic-20261106
    paths:
      - 'web/src/pages/IntegrationsPage.test.tsx'
      - '.github/workflows/mothership-calendar-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolate-calendar-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Verify supported toolchain and install
        run: |
          node scripts/toolchain.mjs
          npm ci
          npm --prefix web ci
      - name: Compare a single test with the full test file
        shell: bash
        run: |
          single_status=0
          file_status=0
          npm --prefix web test -- src/pages/IntegrationsPage.test.tsx -t 'surfaces invalid dates instead of downloading a malformed calendar, then recovers' --reporter=verbose > "$RUNNER_TEMP/calendar-single.log" 2>&1 || single_status=$?
          npm --prefix web test -- src/pages/IntegrationsPage.test.tsx --reporter=verbose > "$RUNNER_TEMP/calendar-file.log" 2>&1 || file_status=$?
          echo "SINGLE_TEST_EXIT=$single_status FULL_FILE_EXIT=$file_status"
          echo '=== isolated failing case ==='
          tail -n 100 "$RUNNER_TEMP/calendar-single.log"
          echo '=== all calendar panel tests ==='
          tail -n 120 "$RUNNER_TEMP/calendar-file.log"
          test "$single_status" -eq 0 && test "$file_status" -eq 0
      - name: Preserve diagnostic evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: calendar-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/calendar-single.log
            ${{ runner.temp }}/calendar-file.log
          if-no-files-found: warn
          retention-days: 7
