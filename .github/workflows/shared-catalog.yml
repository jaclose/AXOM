name: Shared academic catalog
on:
  push:
    branches: [feat/shared-catalog-delivery]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-catalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - name: Isolated validation inputs
        run: |
          git archive --format=tar HEAD web/src web/scripts web/e2e web/package.json web/package-lock.json web/tsconfig.json web/eslint.config.js web/vite.config.ts web/playwright.config.ts scripts supabase/migrations docs AGENTS.md CLAUDE.md .github .gitattributes .gitignore package.json > /tmp/axom-catalog-source.tar
          tar -czf /tmp/axom-catalog-dependencies.tgz web/node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalog-validation-inputs
          path: |
            /tmp/axom-catalog-source.tar
            /tmp/axom-catalog-dependencies.tgz
          retention-days: 1
      - name: Typecheck
        run: npm --prefix web run typecheck
      - name: Catalog, publisher and integration regressions
        working-directory: web
        run: npx vitest run src/lib/cloudLibrary scripts/academic-catalog src/lib/privateLibrary/install.test.ts src/lib/bookshelf src/lib/course-engine/templateLibrary.test.ts
      - name: Lint
        run: npm --prefix web run lint
      - name: Production build
        run: npm --prefix web run build
      - name: Repository hygiene
        run: node scripts/repository-hygiene.mjs
