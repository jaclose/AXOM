name: AXOM Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Repository context and hygiene
        run: node scripts/repository-hygiene.mjs
      - run: npm --prefix web ci
      - name: Release tool regression tests
        run: node --test scripts/*.test.mjs
      - name: Typecheck, lint, test, and production build
        run: |
          result=0
          npm --prefix web run quality > "$RUNNER_TEMP/axom-quality.log" 2>&1 || result=$?
          tail -n 140 "$RUNNER_TEMP/axom-quality.log"
          exit "$result"
      - name: Install browser for production update checks
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Shared library browser regression (synthetic transport)
        run: npm --prefix web run test:e2e -- e2e/cloud-catalog.spec.ts --workers=1
      - name: Shared library browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shared-library-browser-${{ github.run_id }}
          path: web/test-results/cloud-catalog-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Quality diagnostic log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-log-${{ github.run_id }}
          path: ${{ runner.temp }}/axom-quality.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify consent, recovery snapshot and offline update behavior
        run: npm --prefix web run verify:app-updates
      - run: npm --prefix web run verify:daily-games-offline
      - run: npm --prefix web audit --omit=dev --audit-level=high

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
