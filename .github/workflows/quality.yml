name: AXOM Quality

on:
  pull_request:
  push:
    branches: [main, 'integration/**']
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deployment-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: node scripts/toolchain.mjs
      - run: npm ci
      - run: npm run test:deployment
      - name: Prove original GOER exclusion breaks the actual build
        run: npm run verify:deployment -- --without-goer-allowlist --expect-build-failure
      - name: Build clean Vercel-filtered source with the targeted allowlist
        run: npm run verify:deployment

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Repository context and hygiene
        run: node scripts/repository-hygiene.mjs
      - name: Verify supported Node and npm
        run: node scripts/toolchain.mjs
      - run: npm ci
      - run: npm --prefix web ci
      - name: Release tool regression tests
        run: node --test scripts/*.test.mjs
      - run: npm run typecheck:api
      - name: Typecheck, lint, test, and production build
        run: npm --prefix web run quality
      - name: Install browser for production update checks
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Native ZIP question package browser acceptance (no catalog file)
        run: npm --prefix web run test:e2e -- e2e/native-package-zip.spec.ts
      - name: Verify consent, recovery snapshot and offline update behavior
        run: npm --prefix web run verify:app-updates
      - run: npm --prefix web run verify:daily-games-offline
      - run: npm --prefix web audit --omit=dev --audit-level=high

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target
      - name: Verify supported Node and npm
        run: node scripts/toolchain.mjs
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
