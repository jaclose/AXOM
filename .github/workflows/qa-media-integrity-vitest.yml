name: AXOM QA Media Integrity Vitest

on:
  pull_request:
    paths:
      - "web/src/lib/sync/cloudMedia.ts"
      - "web/src/lib/sync/cloudMediaCurrentMainIntegrity.qa.test.ts"
      - "web/src/lib/sync/cloudMediaEpochRevocation.qa.test.ts"
      - "web/src/lib/sync/atomicMediaWrite.ts"
      - "web/src/lib/sync/contentDownloads.ts"
      - "web/src/lib/sync/contentDownloads.mediaIntegrity.test.ts"
      - "web/src/lib/sync/contentDownloads.originalAccountEpoch.test.ts"
      - "web/src/lib/questionAttachments.ts"
      - "web/src/lib/questionAttachmentScope.ts"
      - ".github/workflows/qa-media-integrity-vitest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-integrity:
    name: Independent synthetic media verification (no accounts)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Record and assert literal PR-head commit
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git rev-parse HEAD
          git status --porcelain
          if [[ -n "$EXPECTED_HEAD_SHA" ]]; then
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          fi
      - run: node scripts/toolchain.mjs
      - run: npm --prefix web ci
      - name: Verify cloud media plus available original-recovery suites
        shell: bash
        run: |
          set -euo pipefail
          suites=(
            src/lib/sync/cloudMediaCurrentMainIntegrity.qa.test.ts
            src/lib/sync/cloudMediaEpochRevocation.qa.test.ts
          )
          # R24/R25 are separate held MOTHERSHIP branches. Run their tests
          # once integrated; do not fabricate coverage in the older QA stack.
          for suite in \
            src/lib/sync/contentDownloads.mediaIntegrity.test.ts \
            src/lib/sync/contentDownloads.originalAccountEpoch.test.ts; do
            if [[ -f "web/$suite" ]]; then
              suites+=("$suite")
            else
              echo "NOT INCLUDED IN THIS COMMIT: $suite (not tested)"
            fi
          done
          printf 'Executing %s synthetic suites:\n' "${#suites[@]}"
          printf ' - %s\n' "${suites[@]}"
          npm --prefix web run test -- "${suites[@]}" --reporter=verbose
