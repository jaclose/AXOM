  </g>
  <text x="230" y="839" class="node">Axillary nerve</text>
  <text x="530" y="839" class="node">Radial nerve</text>

  <path d="M44 894H716" stroke="#7B8B95" stroke-opacity=".55"/>
  <text x="44" y="924" class="note">A anterior division · P posterior division</text>
  <text x="44" y="952" class="note">Common pattern. Collateral branches omitted; origins vary.</text>
