  <text x="44" y="129" class="headline">Brachial plexus</text>
  <text x="44" y="165" class="subhead">Posterior cord pathway</text>

  <text x="44" y="214" class="stage">VENTRAL RAMI</text>
  <g fill="url(#panel)" stroke="#738B9C" stroke-width="2">
    <rect x="45" y="231" width="190" height="62" rx="12"/>
    <rect x="285" y="231" width="190" height="62" rx="12"/>
    <rect x="525" y="231" width="190" height="62" rx="12"/>
  </g>
  <text x="140" y="271" class="node">C5 · C6</text>
  <text x="380" y="271" class="node">C7</text>
  <text x="620" y="271" class="node">C8 · T1</text>

  <path d="M140 293V347M380 293V347M620 293V347" stroke="#8EA4B3" stroke-width="3"/>
