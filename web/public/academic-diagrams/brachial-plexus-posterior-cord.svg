  <g fill="#1F3444" stroke="#8EA4B3" stroke-width="2">
    <rect x="45" y="347" width="190" height="62" rx="12"/>
    <rect x="285" y="347" width="190" height="62" rx="12"/>
    <rect x="525" y="347" width="190" height="62" rx="12"/>
  </g>
  <text x="140" y="387" class="node">Upper</text>
  <text x="380" y="387" class="node">Middle</text>
  <text x="620" y="387" class="node">Lower</text>

