<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1030" role="img" aria-labelledby="title description">
  <title id="title">Brachial plexus: posterior cord pathway</title>
  <desc id="description">A schematic common pattern. C5 and C6 form the upper trunk, C7 the middle trunk, and C8 and T1 the lower trunk. The posterior division of each trunk joins the posterior cord, which gives rise to the axillary and radial nerves. Anterior divisions form the lateral and medial cords. Branching can vary.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#718395" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x2="0" y2="1">
      <stop stop-color="#1C2A39"/>
      <stop offset="1" stop-color="#15212E"/>
    </linearGradient>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#F1ECE2}
      .eyebrow{font-size:18px;font-weight:700;letter-spacing:3px;fill:#C8A96A}
      .headline{font-size:39px;font-weight:700;letter-spacing:-1px}
      .subhead{font-size:22px;fill:#CED8DF}
      .stage{font-size:17px;font-weight:700;letter-spacing:2px;fill:#AEBFC9}
      .node{font-size:26px;font-weight:700;text-anchor:middle}
      .small{font-size:19px;fill:#D2DFE6;text-anchor:middle}
      .note{font-size:22px;fill:#C9D4DA}
      .source{font-size:22px;fill:#AEBFC9}
    </style>
  </defs>
  <rect width="760" height="1030" rx="28" fill="#101B28"/>
  <rect width="760" height="1030" rx="28" fill="url(#grid)"/>
  <path d="M44 43H102" stroke="#C8A96A" stroke-width="4" stroke-linecap="round"/>
