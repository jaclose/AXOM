    <pattern id="fiber" width="22" height="24" patternUnits="userSpaceOnUse"><path d="M2 24C10 14 12 8 17 0" fill="none" stroke="#9BB0AF" stroke-opacity=".2" stroke-width="3"/></pattern>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#F1ECE2}
      .eyebrow{font-size:18px;font-weight:700;letter-spacing:3px;fill:#C8A96A}
      .headline{font-size:39px;font-weight:700;letter-spacing:-1px}
      .subhead{font-size:22px;fill:#D0DADE}
      .stage{font-size:19px;font-weight:700;letter-spacing:2px;fill:#AFC2CA}
      .label{font-size:27px;font-weight:700}
      .detail{font-size:22px;fill:#D4DEE2}
      .foot{font-size:21px;fill:#B9C9CF}
    </style>
  </defs>
