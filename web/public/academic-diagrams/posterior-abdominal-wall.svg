<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040" role="img" aria-labelledby="title description">
  <title id="title">Genitofemoral nerve on the anterior psoas major</title>
  <desc id="description">An original anterior-view relationship schematic of the posterior abdominal wall. L1 and L2 contributions form the genitofemoral nerve, which emerges onto the anterior surface of psoas major. Its genital branch enters the inguinal region and carries motor fibers to the cremaster in males; its femoral branch supplies a variable area of upper anterior-thigh skin. The femoral branch of the genitofemoral nerve is distinct from the separate femoral nerve. Branching and sensory territory vary.</desc>
