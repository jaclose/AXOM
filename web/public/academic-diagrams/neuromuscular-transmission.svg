<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1160" role="img" aria-labelledby="title description">
  <title id="title">Presynaptic calcium entry and acetylcholine release</title>
  <desc id="description">Original neuromuscular-junction teaching schematic. In normal transmission, an action potential opens presynaptic voltage-gated calcium channels; calcium entry supports acetylcholine vesicle release across the cleft to nicotinic receptors at the muscle endplate. In the second panel, reduced presynaptic calcium entry leads to reduced acetylcholine release. The comparison is qualitative and not a diagnosis.</desc>
  <metadata>AXOM original teaching diagram, version 1. Primary studies: https://pubmed.ncbi.nlm.nih.gov/9508807/ and https://pubmed.ncbi.nlm.nih.gov/25589670/</metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#8ea4b5" stroke-opacity=".07"/></pattern>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#e4bd74"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#83b5c9"/></marker>
  </defs>
  <style>
    .eyebrow{font:700 19px/1.2 system-ui,sans-serif;letter-spacing:3px;fill:#d7b46f}
    .headline{font:700 46px/1.1 system-ui,sans-serif;letter-spacing:-1.5px;fill:#f5f2ea}
    .subhead{font:23px/1.4 system-ui,sans-serif;fill:#c7d0d7}
    .stage{font:700 21px/1.2 system-ui,sans-serif;letter-spacing:1.5px;fill:#f5f2ea}
    .label{font:700 23px/1.3 system-ui,sans-serif;fill:#f5f2ea}
    .detail{font:20px/1.35 system-ui,sans-serif;fill:#c7d0d7}
    .foot{font:20px/1.35 system-ui,sans-serif;fill:#c7d0d7}
    .source{font:18px/1.35 system-ui,sans-serif;fill:#aebec9}
  </style>
  <rect width="800" height="1160" rx="32" fill="#0e1b2a"/>
  <rect width="800" height="1160" rx="32" fill="url(#grid)"/>
  <path d="M46 43h65" stroke="#d7b46f" stroke-width="5" stroke-linecap="round"/>
  <text x="46" y="78" class="eyebrow">AXOM PHYSIOLOGY</text>
  <text x="46" y="132" class="headline">Neuromuscular</text>
  <text x="46" y="183" class="headline">transmission</text>
  <text x="46" y="221" class="subhead">The presynaptic calcium step</text>

  <rect x="46" y="257" width="708" height="369" rx="18" fill="#182b3b" stroke="#5c7a8c" stroke-width="1.5"/>
  <text x="70" y="294" class="stage">01 · NORMAL RELEASE</text>
  <text x="70" y="324" class="detail">Action potential reaches motor-nerve terminal</text>
  <rect x="70" y="347" width="660" height="87" rx="15" fill="#284254" stroke="#82a6b8" stroke-width="2"/>
  <text x="89" y="379" class="label">Motor-nerve terminal</text>
  <circle cx="409" cy="385" r="19" fill="#d7b46f"/><circle cx="462" cy="385" r="19" fill="#d7b46f"/>
  <text x="502" y="392" class="detail">ACh vesicles</text>
  <rect x="245" y="423" width="45" height="25" rx="5" fill="#e4bd74"/>
  <path d="M267 486V405" fill="none" stroke="#83b5c9" stroke-width="6" marker-end="url(#arrowBlue)"/>
  <text x="86" y="480" class="label">Ca²⁺ influx</text>
  <text x="86" y="508" class="detail">VG Ca²⁺ channel</text>
  <path d="M430 431v65" fill="none" stroke="#e4bd74" stroke-width="6" marker-end="url(#arrowGold)"/>
  <text x="461" y="482" class="label">ACh release</text>
  <text x="70" y="542" class="detail">Synaptic cleft</text>
  <rect x="70" y="552" width="660" height="52" fill="#243d4d"/>
  <path d="M70 552h660" stroke="#5c7a8c" stroke-width="3"/>
  <rect x="391" y="548" width="72" height="33" rx="8" fill="#4b6d7b" stroke="#9ec6d2" stroke-width="2"/>
  <text x="70" y="592" class="label">Muscle endplate</text>
  <text x="386" y="592" class="detail">Nicotinic ACh receptor</text>

  <rect x="46" y="648" width="708" height="369" rx="18" fill="#182b3b" stroke="#5c7a8c" stroke-width="1.5"/>
  <text x="70" y="685" class="stage">02 · REDUCED PRESYNAPTIC ENTRY</text>
  <text x="70" y="715" class="detail">Less calcium entry supports less ACh release</text>
  <rect x="70" y="738" width="660" height="87" rx="15" fill="#284254" stroke="#82a6b8" stroke-width="2"/>
  <text x="89" y="770" class="label">Motor-nerve terminal</text>
  <circle cx="409" cy="776" r="19" fill="#d7b46f" opacity=".5"/><circle cx="462" cy="776" r="19" fill="#d7b46f" opacity=".5"/>
  <text x="502" y="783" class="detail">ACh vesicles</text>
  <rect x="245" y="814" width="45" height="25" rx="5" fill="#e4bd74" opacity=".55"/>
  <path d="M267 878v-82" fill="none" stroke="#83b5c9" stroke-width="4" stroke-dasharray="5 5" marker-end="url(#arrowBlue)"/>
  <text x="86" y="871" class="label">↓ Ca²⁺ influx</text>
  <text x="86" y="899" class="detail">Presynaptic step</text>
  <path d="M430 822v65" fill="none" stroke="#e4bd74" stroke-width="4" stroke-dasharray="5 5" marker-end="url(#arrowGold)"/>
  <text x="461" y="873" class="label">↓ ACh release</text>
  <text x="70" y="933" class="detail">Synaptic cleft</text>
  <rect x="70" y="943" width="660" height="52" fill="#243d4d"/>
  <path d="M70 943h660" stroke="#5c7a8c" stroke-width="3"/>
  <rect x="391" y="939" width="72" height="33" rx="8" fill="#4b6d7b" stroke="#9ec6d2" stroke-width="2"/>
  <text x="70" y="983" class="label">Muscle endplate</text>
  <text x="386" y="983" class="detail">Nicotinic ACh receptor</text>

  <path d="M46 1048h708" stroke="#5e788a" stroke-width="1"/>
  <text x="46" y="1080" class="foot">Qualitative teaching schematic. Reduced release is not zero release.</text>
  <text x="46" y="1107" class="foot">A presynaptic pattern alone does not establish a diagnosis.</text>
  <text x="46" y="1134" class="source">Sources: PMID 9508807 · 25589670 · AXOM original v1</text>
</svg>
