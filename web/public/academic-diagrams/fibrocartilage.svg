<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1030" role="img" aria-labelledby="title description">
  <title id="title">Fibrocartilage tissue schematic</title>
  <desc id="description">An original teaching schematic, not a photomicrograph. Parallel rows of chondrocytes in lacunae lie between thick collagen bundles in a matrix. The outer margin has no perichondrium. The dense bundles are rich in type I collagen, while fibrocartilage also contains type II collagen; the collagen types cannot be read from this drawing.</desc>
  <defs>
    <pattern id="grain" width="27" height="27" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="4" r="1" fill="#937C66" opacity=".18"/>
      <circle cx="19" cy="16" r="1.2" fill="#8D7767" opacity=".12"/>
    </pattern>
    <clipPath id="tissueClip"><path d="M68 238H692V703H68Z"/></clipPath>
    <g id="lacuna">
      <ellipse rx="25" ry="16" fill="#DDE9E7" stroke="#547888" stroke-width="3"/>
      <ellipse rx="12" ry="9" fill="#6A8B99"/>
      <ellipse cx="-4" cy="-3" rx="3" ry="2" fill="#F7F6EE" opacity=".7"/>
    </g>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#F1ECE2}
      .eyebrow{font-size:18px;font-weight:700;letter-spacing:3px;fill:#C8A96A}
      .headline{font-size:39px;font-weight:700;letter-spacing:-1px}
      .subhead{font-size:22px;fill:#D0D9DD}
      .label{font-size:25px;font-weight:700}
      .detail{font-size:23px;fill:#CED8DC}
      .foot{font-size:22px;fill:#AFBEC5}
    </style>
  </defs>
