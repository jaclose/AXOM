<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0e" />
    <script>
      (() => {
        const key = "axom.theme"; // Keep in sync with STORAGE_KEYS.themePreference.
        let preference = "system";
        try {
          const stored = localStorage.getItem(key);
          if (stored === "light" || stored === "dark" || stored === "system") preference = stored;
        } catch { /* storage can be unavailable in private/locked contexts */ }
        let prefersDark = true;
        try { prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? true; } catch { /* dark is the safe brand fallback */ }
        const theme = preference === "system" ? (prefersDark ? "dark" : "light") : preference;
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.themePreference = preference;
        root.style.colorScheme = theme;
        let chrome = theme === "dark" ? "#0d0d0e" : "#f3eee3";
        // Accent palette (keep in sync with STORAGE_KEYS.palettePreference and
        // paletteCss() in src/lib/palette.ts). Names/values are allow-listed so
        // a tampered entry can never escape its declaration block.
        try {
          const ids = ["ivory", "amethyst", "sapphire", "midnight", "emerald", "rose", "platinum", "custom"];
          // Until someone picks a palette: DEFAULT_PALETTE_ID and paletteVars() in src/lib/palette.ts.
          const fallback = { id: "midnight", vars: {"dark":{"--accent-rgb":"214, 180, 110","--accent-ink-rgb":"220, 188, 124","--accent-hi-rgb":"248, 224, 170","--accent-lo-rgb":"170, 138, 78","--accent-hi":"#f8e0aa","--accent-lo":"#aa8a4e","--on-accent":"#1a160e","--gold":"#dcbc7c","--gold-soft":"rgba(220, 188, 124, 0.14)","--gold-line":"rgba(220, 188, 124, 0.34)","--gold-glow":"rgba(220, 188, 124, 0.22)","--axom-gold":"#d6b46e","--axom-gold-soft":"#f8e0aa","--shadow-gold":"0 0 0 1px rgba(220, 188, 124, 0.28), 0 10px 28px rgba(220, 188, 124, 0.12)","--frame-gold":"0 0 0 1px rgba(220, 188, 124, 0.5), 0 0 0 2px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(230, 226, 214, 0.06)","--axom-focus-ring":"0 0 0 1px rgba(214, 180, 110, 0.72), 0 0 0 6px rgba(214, 180, 110, 0.12)","--cool-accent":"#96aad2","--cool-accent-strong":"#c3d0ea","--cool-accent-soft":"rgba(150, 170, 210, 0.1)","--cool-accent-line":"rgba(150, 170, 210, 0.24)","--bg-1":"#04060d","--bg-2":"#070a15","--bg-3":"#0c1222","--axom-bg":"#070a15","--axom-bg-soft":"#0c1222","--tint-rgb":"90, 120, 190","--orb-a-rgb":"150, 170, 210","--orb-rgb":"214, 180, 110","--cool-rgb":"150, 170, 210","--on-cool":"#1a160e","--ambient":"2.2","--paper-rgb":"12, 18, 34","--ink-rgb":"230, 226, 214","--glass-card-fill":"rgba(17, 21, 31, 0.6)","--surface-1":"rgba(25, 27, 35, 0.62)","--surface-2":"rgba(28, 30, 39, 0.72)","--shell-fill":"rgba(15, 17, 24, 0.66)"},"light":{"--accent-rgb":"200, 164, 92","--accent-ink-rgb":"125, 90, 31","--accent-hi-rgb":"224, 196, 136","--accent-lo-rgb":"31, 47, 85","--accent-hi":"#e0c488","--accent-lo":"#1f2f55","--on-accent":"#1a160e","--gold":"#7d5a1f","--gold-soft":"rgba(125, 90, 31, 0.12)","--gold-line":"rgba(125, 90, 31, 0.42)","--gold-glow":"rgba(125, 90, 31, 0.17)","--axom-gold":"#7d5a1f","--axom-gold-soft":"#1f2f55","--shadow-gold":"0 0 0 1px rgba(125, 90, 31, 0.25), 0 10px 24px rgba(125, 90, 31, 0.1)","--frame-gold":"0 0 0 1px rgba(125, 90, 31, 0.45), 0 0 0 2px rgba(255, 255, 255, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.9)","--axom-focus-ring":"0 0 0 1px rgba(125, 90, 31, 0.72), 0 0 0 6px rgba(125, 90, 31, 0.12)","--cool-accent":"#34466e","--cool-accent-strong":"#22335a","--cool-accent-soft":"rgba(52, 70, 110, 0.1)","--cool-accent-line":"rgba(52, 70, 110, 0.25)","--bg-1":"#edf0f6","--bg-2":"#f8f9fc","--bg-3":"#e1e6f0","--axom-bg":"#f8f9fc","--axom-bg-soft":"#e1e6f0","--tint-rgb":"52, 70, 110","--orb-a-rgb":"52, 70, 110","--orb-rgb":"200, 164, 92","--cool-rgb":"52, 70, 110","--on-cool":"#faf8f4","--ambient":"1.5","--paper-rgb":"220, 227, 240","--ink-rgb":"26, 36, 62","--glass-card-fill":"rgba(251, 252, 254, 0.74)","--surface-1":"rgba(255, 255, 255, 0.62)","--surface-2":"rgba(255, 255, 255, 0.78)","--shell-fill":"rgba(248, 249, 252, 0.72)"}} };
          let palette = fallback;
          try { palette = JSON.parse(localStorage.getItem("axom.palette.v1") || "null") || fallback; } catch { /* unreadable: the default */ }
          if (!palette || (!ids.includes(palette.id) && palette.id !== "classic")) palette = fallback;
          if (ids.includes(palette.id) && palette.vars && palette.vars.dark && palette.vars.light) {
            const name = /^--[a-z0-9-]{1,40}$/;
            const value = /^[#0-9a-zA-Z(),.%\s-]{1,200}$/;
            const block = (record) => Object.keys(record)
              .filter((key) => name.test(key) && typeof record[key] === "string" && value.test(record[key]))
              .map((key) => key + ": " + record[key] + ";").join(" ");
            const style = document.createElement("style");
            style.id = "axom-palette";
            style.textContent = ':root[data-palette="' + palette.id + '"] { ' + block(palette.vars.dark) + ' }\n'
              + ':root[data-palette="' + palette.id + '"][data-theme="light"] { ' + block(palette.vars.light) + ' }';
            document.head.appendChild(style);
            root.dataset.palette = palette.id;
            const bg = palette.vars[theme] && palette.vars[theme]["--bg-2"];
            if (typeof bg === "string" && /^#[0-9a-f]{6}$/i.test(bg)) chrome = bg;
          }
        } catch { /* classic gold is the safe fallback */ }
        try {
          if (localStorage.getItem("axom.motion") === "reduce") root.dataset.motion = "reduce";
        } catch { /* motion follows the device */ }
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", chrome);
      })();
    </script>
    <style>
      /* Before any stylesheet loads: the films' black (or the light theme's paper), never browser white. */
      html { background: #0d0d0e; color-scheme: dark; }
      html[data-theme="light"] { background: #f3eee3; color-scheme: light; }
    </style>
    <meta name="description" content="AXOM — a private academic operating system. Courses, mastery tracking, sessions, questions, and recovery in one calm cockpit." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>AXOM | A private academic operating system</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>AXOM needs JavaScript to open your workspace. Please enable it and reload.</noscript>
    <script type="module" src="/src/entry.tsx"></script>
  </body>
</html>
